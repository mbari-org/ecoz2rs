[package]
name = "ecoz2"
version = "0.8.0"
authors = [
    "Carlos A. Rueda <carueda@mbari.org>",
]
description = "Linear Predictive Coding Vector Quantization and Hidden Markov Modeling for Pattern Recognition"
repository = "https://github.com/mbari-org/ecoz2rs"
license = "MIT OR Apache-2.0"
keywords = [
    "hmm",
    "hidden-markov-model",
    "linear-prediction",
    "vector-quantization",
    "machine-learning",
]

edition = "2021"

[dependencies]

assert_approx_eq = "1.1.0"
byteorder = "1.3.4"
clap = { version = "3.2.22", features = ["derive"] }
colored = "3.0.0"
csv = "1.1"
hound = "3.5.0"
itertools = "0.15.0"
ndarray = { version = "0.17.2", features = ["serde"] }
num_cpus = "1.0"
rand = "0.10"
rayon = "1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.53"
serde-pickle = "1.2"
walkdir = "2.3.1"


# https://stackoverflow.com/a/34054833/830737
[profile.dev]
opt-level = 3

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "my_benchmark"
harness = false
